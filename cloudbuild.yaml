# --------------------------------------------------------------
# Pipeline Cloud Build complet avec lint, tests, sécurité
# --------------------------------------------------------------
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _REGISTRY: eu.gcr.io
  _IMAGE_BACKEND: backend
  _IMAGE_FRONTEND: frontend
  _SERVICE_BACKEND: sneaker-api
  _SERVICE_FRONTEND: sneaker-frontend

steps:
  # --------------------------------------------------------------
  # 1️⃣  Install pnpm & fetch dependencies
  # --------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'Install dependencies'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache git
        corepack enable
        corepack prepare pnpm@latest --activate
        pnpm install --frozen-lockfile

  # --------------------------------------------------------------
  # 2️⃣  Lint & Type check
  # --------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'Lint'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        corepack enable
        corepack prepare pnpm@latest --activate
        pnpm run lint
        pnpm --filter @sneaker-tracker/backend type-check

  # --------------------------------------------------------------
  # 3️⃣  Tests & Coverage
  # --------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'Tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        corepack enable
        corepack prepare pnpm@latest --activate
        pnpm --filter @sneaker-tracker/backend test:ci

  # --------------------------------------------------------------
  # 4️⃣  Security audit
  # --------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'Security audit'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        corepack enable
        corepack prepare pnpm@latest --activate
        pnpm audit --audit-level=high || true

  # --------------------------------------------------------------
  # 5️⃣  Build applications
  # --------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'Build'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        corepack enable
        corepack prepare pnpm@latest --activate
        pnpm run build

  # --------------------------------------------------------------
  # 6️⃣  Build & push Docker images
  # --------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build backend image'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_BACKEND}:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_BACKEND}:latest'
      - '-f'
      - 'apps/backend/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push backend image'
    args:
      - 'push'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_BACKEND}:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build frontend image'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_FRONTEND}:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_FRONTEND}:latest'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push frontend image'
    args:
      - 'push'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_FRONTEND}:${SHORT_SHA}'

  # --------------------------------------------------------------
  # 7️⃣  Security scan avec Trivy
  # --------------------------------------------------------------
  - name: 'aquasec/trivy:latest'
    id: 'Trivy scan backend'
    args:
      - 'image'
      - '--severity=HIGH,CRITICAL'
      - '--ignore-unfixed'
      - '--format=json'
      - '--output=trivy-backend.json'
      - '--exit-code=0'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_BACKEND}:${SHORT_SHA}'

  - name: 'aquasec/trivy:latest'
    id: 'Trivy scan frontend'
    args:
      - 'image'
      - '--severity=HIGH,CRITICAL'
      - '--ignore-unfixed'
      - '--format=json'
      - '--output=trivy-frontend.json'
      - '--exit-code=0'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_FRONTEND}:${SHORT_SHA}'

  # --------------------------------------------------------------
  # 8️⃣  Deploy sur Cloud Run (Staging)
  # --------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy backend staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_BACKEND}-stg'
      - '--image'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_BACKEND}:${SHORT_SHA}'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SUPABASE_URL=$$SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY=$$SUPABASE_SERVICE_ROLE_KEY,APP_KEY=$$APP_KEY,NODE_ENV=staging'
    secretEnv: ['SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'APP_KEY']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy frontend staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_FRONTEND}-stg'
      - '--image'
      - '${_REGISTRY}/${PROJECT_ID}/${_IMAGE_FRONTEND}:${SHORT_SHA}'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SUPABASE_URL=$$SUPABASE_URL,SUPABASE_ANON_KEY=$$SUPABASE_ANON_KEY,NODE_ENV=staging'
    secretEnv: ['SUPABASE_URL', 'SUPABASE_ANON_KEY']

# --------------------------------------------------------------
# 9️⃣  Secrets depuis Secret Manager
# --------------------------------------------------------------
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_URL/versions/latest
      env: 'SUPABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_ANON_KEY/versions/latest
      env: 'SUPABASE_ANON_KEY'
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_SERVICE_ROLE_KEY/versions/latest
      env: 'SUPABASE_SERVICE_ROLE_KEY'
    - versionName: projects/$PROJECT_ID/secrets/APP_KEY/versions/latest
      env: 'APP_KEY'
    - versionName: projects/$PROJECT_ID/secrets/SENTRY_DSN/versions/latest
      env: 'SENTRY_DSN'

timeout: '1800s'
