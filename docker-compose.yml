version: '3.9'

services:
  supabase:
    image: supabase/postgres:15
    container_name: supabase-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - supabase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    ports:
      - "3333:3333"
    depends_on:
      supabase:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3333
      - HOST=0.0.0.0

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000

volumes:
  supabase-data:

